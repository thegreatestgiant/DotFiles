scan_timeout = 100  # in milliseconds 
command_timeout = 500

format = """
[░▒▓](#a3aed2)\
$os\
[](bg:#769ff0 fg:#a3aed2)\
$hostname\
$directory\
[](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#212736)\
$nodejs\
$rust\
$golang\
$php\
$java\
$python\
${custom.toml}\
${custom.yaml}\
${custom.json}\
[](fg:#212736 bg:#1d2230)\
$time\
[ ](fg:#1d2230)\
\n$character"""

[os]
disabled = false
style = "bg:#a3aed2 fg:#090c0c"
format = "[ $symbol ]($style)"

[os.symbols]
CachyOS = ""
Arch = ""

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
format = '[ $symbol $branch ](fg:#769ff0 bg:#394260)'

[git_status]
format = '[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)'

[nodejs]
symbol = ""
format = '[ $symbol ($version) ](fg:#769ff0 bg:#212736)'

[rust]
symbol = ""
format = '[ $symbol ($version) ](fg:#769ff0 bg:#212736)'

[golang]
symbol = ""
format = '[ $symbol ($version) ](fg:#769ff0 bg:#212736)'

[php]
symbol = ""
format = '[ $symbol ($version) ](fg:#769ff0 bg:#212736)'

[java]
symbol = ""
format = '[ $symbol ($version) ](fg:#769ff0 bg:#212736)'

[python]
symbol = ""
format = '[ $symbol ($version) ](fg:#769ff0 bg:#212736)'

[custom.toml]
detect_extensions = ["toml"]
symbol = ""
format = '[ $symbol ](fg:#769ff0 bg:#212736)'

[custom.yaml]
detect_extensions = ["yaml", "yml"]
symbol = ""
format = '[ $symbol ](fg:#769ff0 bg:#212736)'

[custom.json]
detect_extensions = ["json"]
symbol = ""
format = '[ $symbol ](fg:#769ff0 bg:#212736)'

[time]
disabled = false
time_format = "%I:%M %p" # Hour:Minute Format
format = '[  $time ](fg:#a0a9cb bg:#1d2230)'

[hostname]
ssh_only = false
style = "fg:#e3e5e5 bg:#769ff0"
format = "[ $hostname ┃]($style)"

[character]
success_symbol = "[❯](fg:#769ff0)"
error_symbol = "[❯](fg:#e06c75)"

