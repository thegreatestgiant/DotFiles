$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts

$rofiPath = $HOME/.config/hypr/rofi/config.rasi

# ----------------------------------------------------- 
# 🚀 APPLICATIONS & LAUNCHERS
# ----------------------------------------------------- 
bindd = ALT, SPACE, app launcher, exec, pkill rofi || true && rofi -show drun -modi drun,filebrowser,run,window -config ~/.config/hypr/rofi/config.rasi
bindd = $mainMod, Return, Open terminal, exec, $term
bindd = $mainMod, E, file manager, exec, $files
bindd = $mainMod, B, open default browser, exec, xdg-open "https://"
bindd = $mainMod, O, Obsidian, exec, obsidian
bindd = $mainMod, X, WhatsApp, exec, brave-browser --app-id=hnpfjngllnobngcgfapefoaidbinmjnm
bindd = $mainMod, G, Bitwarden, exec, bitwarden
bindd = , F12, Open the G-Helper Equiv, exec, rog-control-center


# ----------------------------------------------------- 
# 📋 FEATURES / EXTRAS
# ----------------------------------------------------- 
bindd = $mainMod SHIFT, SLASH, help / cheat sheet, exec, $scriptsDir/KeyHints.sh
bindd = $mainMod ALT, R, refresh bar and menus, exec, $scriptsDir/Refresh.sh
bindd = $mainMod, period, emoji menu, exec, rofimoji 
bindd = $mainMod, S, web search, exec, $scriptsDir/RofiSearch.sh
bindd = $mainMod, V, clipboard manager, exec, $scriptsDir/ClipManager.sh
bindd = $mainMod, C, calculator, exec, $scriptsDir/RofiCalc.sh
bindd = $mainMod, W, select wallpaper, exec, $scriptsDir/WallpaperSelect.sh
bindd = CTRL ALT, W, random wallpaper, exec, $scriptsDir/WallpaperRandom.sh
bindd = $mainMod SHIFT, M, online music, exec, $scriptsDir/RofiBeats.sh
bindd = $mainMod, SLASH, search keybinds, exec, $scriptsDir/KeyBinds.sh
bindd = $mainMod, A, desktop overview, exec, $scriptsDir/OverviewToggle.sh # toggles quickshell or ags overview (tries QS first, falls back to AGS)

# ----------------------------------------------------- 
# 🪟 WINDOW MANAGEMENT
# ----------------------------------------------------- 
bindd = $mainMod, Q, close active window, killactive,
bindd = $mainMod SHIFT, Q, Terminate active process, exec, $scriptsDir/KillActiveProcess.sh
bindd = $mainMod, SPACE, Float current window, togglefloating,
bindd = $mainMod ALT, SPACE, Float all windows, exec, hyprctl dispatch workspaceopt allfloat
bindd = $mainMod SHIFT, F, fullscreen, fullscreen
bindd = $mainMod, F, maximize window, fullscreen, 1
bindd = $mainMod, O, toggle active window opacity, setprop, active opaque toggle
bindd = $mainMod, grave, DropDown terminal, exec, $scriptsDir/Dropterminal.sh $term

# ----------------------------------------------------- 
# 🎯 FOCUS & NAVIGATION
# ----------------------------------------------------- 
bindd = $mainMod, H, focus left, movefocus, l
bindd = $mainMod, L, focus right, movefocus, r
bindd = $mainMod, K, focus up, movefocus, u
bindd = $mainMod, J, focus down, movefocus, d
bindd = ALT, tab, cycle next window, cyclenext
bindd = ALT, tab, bring active to top, bringactivetotop

# ----------------------------------------------------- 
# 🏗️ LAYOUT CONTROLS (Master)
# ----------------------------------------------------- 
bindd = $mainMod CTRL, D, remove master, layoutmsg, removemaster
bindd = $mainMod, I, add master, layoutmsg, addmaster
bindd = $mainMod SHIFT, Return, swap with master, layoutmsg, swapwithmaster

# ----------------------------------------------------- 
# 🖥️ WORKSPACE CONTROLS
# ----------------------------------------------------- 
bindd = $mainMod, tab, next workspace, workspace, m+1
bindd = $mainMod SHIFT, tab, previous workspace, workspace, m-1
bindd = $mainMod, U, toggle special workspace, togglespecialworkspace,
bindd = $mainMod SHIFT, U, move to special workspace, movetoworkspace, special
bindd = $mainMod, mouse_down, next workspace, workspace, e+1
bindd = $mainMod, mouse_up, previous workspace, workspace, e-1

# Monitor switching
bindd = $mainMod CTRL, F9, move workspace to left monitor, movecurrentworkspacetomonitor, l
bindd = $mainMod CTRL, F10, move workspace to right monitor, movecurrentworkspacetomonitor, r
bindd = $mainMod CTRL, F11, move workspace to up monitor, movecurrentworkspacetomonitor, u
bindd = $mainMod CTRL, F12, move workspace to down monitor, movecurrentworkspacetomonitor, d

# Numeric workspace switching (1-10)
bindd = $mainMod, code:10, workspace 1, workspace, 1
bindd = $mainMod, code:11, workspace 2, workspace, 2
bindd = $mainMod, code:12, workspace 3, workspace, 3
bindd = $mainMod, code:13, workspace 4, workspace, 4
bindd = $mainMod, code:14, workspace 5, workspace, 5
bindd = $mainMod, code:15, workspace 6, workspace, 6
bindd = $mainMod, code:16, workspace 7, workspace, 7
bindd = $mainMod, code:17, workspace 8, workspace, 8
bindd = $mainMod, code:18, workspace 9, workspace, 9
bindd = $mainMod, code:19, workspace 10, workspace, 10

# Move window to workspace (1-10)
bindd = $mainMod SHIFT, code:10, move to workspace 1, movetoworkspace, 1
bindd = $mainMod SHIFT, code:11, move to workspace 2, movetoworkspace, 2
bindd = $mainMod SHIFT, code:12, move to workspace 3, movetoworkspace, 3
bindd = $mainMod SHIFT, code:13, move to workspace 4, movetoworkspace, 4
bindd = $mainMod SHIFT, code:14, move to workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, code:15, move to workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, code:16, move to workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, code:17, move to workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, code:18, move to workspace 9, movetoworkspace, 9
bindd = $mainMod SHIFT, code:19, move to workspace 10, movetoworkspace, 10

# ----------------------------------------------------- 
# 🛠️ SYSTEM & HARDWARE
# ----------------------------------------------------- 
bindd = CTRL ALT, Delete, exit Hyprland, exec, hyprctl dispatch exit 0
bindd = CTRL ALT, L, lock screen, exec, $scriptsDir/LockScreen.sh
bindd = $mainMod, P, powermenu, exec, $scriptsDir/Wlogout.sh
bindd = $mainMod, N, notification panel, exec, swaync-client -t -sw
bindd = $mainMod SHIFT, E, Quick settings menu, exec, $scriptsDir/Kool_Quick_Settings.sh
bindd = $mainMod SHIFT, B, toggle waybar on/off, exec, pkill -SIGUSR1 waybar
bindlnd = ALT_L, SHIFT_L, switch keyboard layout globally, exec, $scriptsDir/KeyboardLayout.sh switch

# Media & Hardware Keys
bindeld = , xf86audioraisevolume, volume up, exec, $scriptsDir/Volume.sh --inc
bindeld = , xf86audiolowervolume, volume down, exec, $scriptsDir/Volume.sh --dec
bindld = , xf86AudioMicMute, toggle mic mute, exec, $scriptsDir/Volume.sh --toggle-mic
bindld = , xf86Sleep, sleep, exec, systemctl suspend
bindld = , xf86Rfkill, airplane mode, exec, $scriptsDir/AirplaneMode.sh
bindd = , Print, screenshot (swappy), exec, $scriptsDir/ScreenShot.sh --swappy

# ----------------------------------------------------- 
# 📏 RESIZE, MOVE, & SWAP (Mouse/Keyboard)
# ----------------------------------------------------- 
binde = $mainMod SHIFT, h, resizeactive, -50 0
binde = $mainMod SHIFT, l, resizeactive, 50 0
binde = $mainMod SHIFT, k, resizeactive, 0 -50
binde = $mainMod SHIFT, j, resizeactive, 0 50

bind = $mainMod CTRL, h, movewindow, l
bind = $mainMod CTRL, l, movewindow, r
bind = $mainMod CTRL, k, movewindow, u
bind = $mainMod CTRL, j, movewindow, d

bind = $mainMod ALT, h, swapwindow, l
bind = $mainMod ALT, l, swapwindow, r
bind = $mainMod ALT, k, swapwindow, u
bind = $mainMod ALT, j, swapwindow, d

bindmd = $mainMod, mouse:272, move window, movewindow
bindmd = $mainMod, mouse:273, resize window, resizewindow

# ----------------------------------------------------- 
# 🔄 MODAL SUBMAPS
# ----------------------------------------------------- 
# Resize Submap (Super + R)
bind = $mainMod, R, submap, resize
submap = resize
binde = , h, resizeactive, -20 0
binde = , l, resizeactive, 20 0
binde = , k, resizeactive, 0 -20
binde = , j, resizeactive, 0 20
bind = , escape, submap, reset 
bind = $mainMod, R, submap, reset
submap = reset

# Move Submap (Super + D)
bind = $mainMod, D, submap, move
submap = move
bind = , h, movewindow, l
bind = , l, movewindow, r
bind = , k, movewindow, u
bind = , j, movewindow, d
bind = , 1, movetoworkspace, 1
bind = , 2, movetoworkspace, 2
bind = , 3, movetoworkspace, 3
bind = , 4, movetoworkspace, 4
bind = , 5, movetoworkspace, 5
bind = , 6, movetoworkspace, 6
bind = , 7, movetoworkspace, 7
bind = , 8, movetoworkspace, 8
bind = , 9, movetoworkspace, 9
bind = , 0, movetoworkspace, 10
bind = , escape, submap, reset 
bind = $mainMod, D, submap, reset
submap = reset
